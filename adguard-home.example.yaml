# AdGuard Home configuration. Serves low-latency 0-RTT DNS on 5335 (UDP/TCP),
# private DNSCrypt on 5443, private DoT/DoQ on 853, and private DoH on 8445.
schema_version: 29
http:
  address: 127.0.0.1:3000
  pprof:
    enabled: false
    port: 6060
users: []
auth_attempts: 5
block_auth_min: 15
querylog:
  enabled: false
  file_enabled: false
  interval: 24h
  size_memory: 0
statistics:
  enabled: false
  interval: 24h
log:
  enabled: false
  file: ""
  verbose: false
dns:
  bind_hosts:
    - 0.0.0.0
  port: 5335
  anonymize_client_ip: true
  ratelimit: 100
  ratelimit_whitelist:
    - 127.0.0.1
    - 10.8.0.1
  allowed_clients: []
  refuse_any: true
  upstream_dns:
    - https://dns.quad9.net/dns-query
    - tls://dns.quad9.net
    - https://cloudflare-dns.com/dns-query
    - quic://dns.adguard-dns.com
  bootstrap_dns:
    - 9.9.9.9
    - 1.1.1.1
  upstream_mode: parallel
  upstream_timeout: 10s
  cache_size: 4194304
  cache_ttl_min: 300
  cache_ttl_max: 86400
  cache_optimistic: true
  use_private_ptr_resolvers: false
  handle_ddr: false
  serve_plain_dns: true
  edns_client_subnet:
    enabled: false
    use_custom: false
    custom_ip: ""
  max_goroutines: 300
tls:
  enabled: true
  server_name: <YOUR_TLS_SERVER_NAME>
  force_https: false
  port_https: 8445
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 5443
  dnscrypt_config_file: /run/fortress/adguard/dnscrypt.yaml
  allow_unencrypted_doh: false
  certificate_path: /run/fortress/cert.pem
  private_key_path: /run/fortress/key.pem
filters: []
whitelist_filters: []
user_rules: []
filtering:
  protection_enabled: true
  filtering_enabled: true
  filters_update_interval: 0
  parental_enabled: false
  safebrowsing_enabled: false
clients:
  runtime_sources:
    whois: false
    arp: false
    rdns: false
    dhcp: false
    hosts: false
  persistent: []
