# AdGuard Home v0.107.79 schema. Plain DNS is disabled; private DoT/DoQ/DoH
# use the operator's certificate and are reachable only through the VPN address.
schema_version: 29
http:
  address: 10.8.0.1:3000
  pprof:
    enabled: false
    port: 6060
users: []
auth_attempts: 5
block_auth_min: 15
querylog:
  enabled: false
  file_enabled: false
  interval: 24h
  size_memory: 0
statistics:
  enabled: false
  interval: 24h
log:
  enabled: false
  file: ""
  verbose: false
dns:
  bind_hosts:
    - 127.0.0.1
    - 10.8.0.1
  port: 5335
  anonymize_client_ip: true
  ratelimit: 100
  ratelimit_whitelist:
    - 127.0.0.1
    - 10.8.0.1
  allowed_clients:
    - 127.0.0.0/8
    - 10.8.0.0/24
  refuse_any: true
  upstream_dns:
    - tls://dns.quad9.net
    - https://dns.quad9.net/dns-query
  bootstrap_dns:
    - 9.9.9.9
  upstream_mode: load_balance
  upstream_timeout: 10s
  cache_size: 4194304
  cache_ttl_min: 0
  cache_ttl_max: 0
  cache_optimistic: false
  use_private_ptr_resolvers: false
  handle_ddr: false
  serve_plain_dns: false
  edns_client_subnet:
    enabled: false
    use_custom: false
    custom_ip: ""
  max_goroutines: 300
tls:
  enabled: true
  server_name: <YOUR_TLS_SERVER_NAME>
  force_https: true
  port_https: 8445
  port_dns_over_tls: 853
  port_dns_over_quic: 853
  port_dnscrypt: 0
  allow_unencrypted_doh: false
  certificate_path: /run/fortress/cert.pem
  private_key_path: /run/fortress/key.pem
filters: []
whitelist_filters: []
user_rules: []
filtering:
  protection_enabled: true
  filtering_enabled: true
  filters_update_interval: 0
  parental_enabled: false
  safebrowsing_enabled: false
clients:
  runtime_sources:
    whois: false
    arp: false
    rdns: false
    dhcp: false
    hosts: false
  persistent: []
